<%
  # O que muda de uma instalação para outra vem de ~/.config/prisma/producao.env
  # (o bin/implantar carrega), e não deste arquivo, que vai para o git:
  #   PRISMA_SERVIDOR    endereço do servidor, para o SSH e o deploy
  #   PRISMA_SSH_USER    usuário do SSH no servidor (precisa estar no grupo docker)
  #   PRISMA_ENDERECO    (opcional) o nome ou IP que as pessoas digitam no
  #                      navegador; se não houver, é o do servidor
  servidor = ENV.fetch("PRISMA_SERVIDOR") { raise "Defina PRISMA_SERVIDOR em ~/.config/prisma/producao.env (docs/implantacao.md)." }
  endereco = ENV.fetch("PRISMA_ENDERECO", servidor)
%>
# Implantação em produção com o Kamal. O passo a passo, os segredos e o que
# conferir antes de colocar dados reais estão em docs/implantacao.md. Rode pelo
# bin/implantar, que carrega os segredos de fora do repositório.

# Nome da aplicação, usado para identificar os containers.
service: prisma

# Imagem. Com o registry local do Kamal (abaixo), o nome fica só "prisma".
image: prisma

# Servidor. O Kamal conecta por SSH com o usuário e a chave de ssh (abaixo).
servers:
  web:
    - <%= servidor %>

# O kamal-proxy fica nas portas 80 e 443, termina o HTTPS e repassa para a
# aplicação, sem tirar o servidor do ar a cada deploy. A porta 80 só redireciona
# para o HTTPS. Os segredos nomeados aqui vêm de .kamal/secrets.
#
# TLS é obrigatório (config/environments/production.rb assume HTTPS). Sem nome
# de DNS não há como usar o Let's Encrypt: o certificado é o da instituição ou
# um próprio, com o IP (docs/implantacao.md, "HTTPS").
proxy:
  host: <%= endereco %>
  ssl:
    certificate_pem: SSL_CERTIFICATE_PEM
    private_key_pem: SSL_PRIVATE_KEY_PEM

# As imagens ficam num registry local, que o Kamal sobe nesta máquina e abre para
# o servidor por um túnel SSH: não precisa de conta em registry nenhum.
registry:
  server: localhost:5555

# Variáveis do container. Os segredos vêm de .kamal/secrets (nunca escreva o valor
# aqui). O container do app NÃO recebe a senha do dono do banco: o DATABASE_URL
# dele é de um usuário que só faz o que o sistema faz (app/models/privilegios_do_banco.rb).
env:
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  clear:
    # Domínios aceitos (proteção contra Host header / DNS rebinding)
    APP_HOSTS: <%= endereco %>

    # Obrigatório: a faixa da rede Docker "kamal", por onde o kamal-proxy fala com
    # a aplicação, para o IP real de quem acessa (auditoria de leitura e limite de
    # login) não poder ser forjado. A rede é criada no servidor com esta faixa
    # (docker network create --subnet 172.30.20.0/24 kamal); se for recriada com
    # outra, confira com:
    #   docker network inspect kamal --format '{{(index .IPAM.Config 0).Subnet}}'
    PROXIES_CONFIAVEIS: 172.30.20.0/24

    # Encarregado de dados (DPO) da instituição, mostrado em /privacidade
    # PRISMA_ENCARREGADO: "Maria Souza · dpo@hospital.gov.br"

    PRISMA_FUSO_HORARIO: America/Sao_Paulo
    RAILS_LOG_LEVEL: info

# Atalhos: "bin/implantar console", "bin/implantar logs" etc.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Volume nomeado, no servidor: o cache em arquivo do limite de tentativas de
# login, que assim sobrevive ao deploy (config/environments/production.rb,
# PRISMA_CACHE_DIR). O Prisma não guarda arquivos enviados (não usa Active
# Storage), então não há mais nada para fazer backup além do banco.
volumes:
  - "prisma_cache:/rails/tmp/cache"

# Passa os assets com nome por versão de um deploy para o outro, para nenhuma
# requisição em andamento receber 404.
asset_path: /rails/public/assets

# Imagem de produção (Dockerfile.production); o Dockerfile da raiz é de desenvolvimento.
builder:
  arch: amd64
  dockerfile: Dockerfile.production

# Usuário e chave do SSH. A chave é a do deploy (docs/implantacao.md, "Acesso ao
# servidor"); o bin/implantar a entrega ao container em PRISMA_SSH_KEY.
# keys_only: só a chave indicada, nunca as de um agente SSH.
ssh:
  user: <%= ENV.fetch("PRISMA_SSH_USER") { raise "Defina PRISMA_SSH_USER em ~/.config/prisma/producao.env (docs/implantacao.md)." } %>
  keys:
    - <%= ENV.fetch("PRISMA_SSH_KEY", "~/.ssh/prisma_deploy_ed25519") %>
  keys_only: true

# O banco: um MariaDB em container, no mesmo servidor, SEM porta publicada. Só
# a rede Docker "kamal" o alcança (o app o chama por prisma-db). Os dados ficam
# em ~/prisma-db/data do usuário do SSH, no servidor (faça backup:
# bin/backup-banco). A senha do dono (root) só é usada pelo hook de migração
# (.kamal/hooks/pre-app-boot), num container que some depois, e nos backups; o
# app usa outro usuário.
accessories:
  db:
    image: mariadb:10.11
    host: <%= servidor %>
    cmd: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    env:
      clear:
        MARIADB_DATABASE: prisma_production
        MARIADB_AUTO_UPGRADE: "1"
      secret:
        - MARIADB_ROOT_PASSWORD
    directories:
      - data:/var/lib/mysql
